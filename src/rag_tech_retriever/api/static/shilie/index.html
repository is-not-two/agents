<!doctype html>
<html lang="zh-CN" data-layout="portal">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>时列 · 工作区</title>
    <link rel="icon" href="/static/shilie/favicon.svg?v=102" />
    <link rel="stylesheet" href="/static/shilie/app.css?v=102" />
    <script type="module" src="/static/shilie/app.js?v=102"></script>
    <link rel="stylesheet" href="/static/shilie/story.css?v=102" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#home"
        ><span class="brand-mark">时</span><strong>时列</strong></a
      ><span class="preview-label">个人工作区</span>
      <nav class="position" id="position" aria-label="当前位置"></nav>
      <div class="top-actions">
        <button class="quick-trigger" id="quick-open">
          快速打开 <kbd>Ctrl K</kbd>
        </button>
        <details class="layout-menu">
          <summary>导航模式</summary>
          <div class="segmented">
            <button data-mode="portal">入口模式</button
            ><button data-mode="sidebar">侧栏模式</button>
          </div>
        </details>
      </div>
    </header>
    <nav id="navigation-strip" aria-label="页面返回" hidden>
      <button data-action="back" class="global-back">
        <span aria-hidden="true">←</span> 返回上一级</button
      ><a href="#home">回到首页 ↗</a
      ><span class="navigation-hint">时列 · 让每一步有迹可循</span>
    </nav>
    <aside class="sidebar" id="sidebar" aria-label="模块导航"></aside>
    <main id="content" tabindex="-1"><p role="status">正在连接工作区…</p></main>
    <dialog
      id="detail-dialog"
      class="detail-drawer"
      aria-labelledby="detail-title"
    >
      <header class="drawer-header">
        <h2 id="detail-title"></h2>
        <button id="detail-close" class="icon-button" aria-label="关闭详情">
          ×
        </button>
      </header>
      <div id="detail-content" class="drawer-content"></div>
    </dialog>
    <dialog id="quick-dialog" aria-labelledby="quick-title">
      <div class="quick-header">
        <h2 id="quick-title">打开模块</h2>
        <button id="quick-close" class="icon-button" aria-label="关闭快速打开">
          ×
        </button>
      </div>
      <input
        id="quick-query"
        type="search"
        aria-label="筛选模块"
        placeholder="搜索模块"
      />
      <nav id="quick-results"></nav>
    </dialog>
    <div id="toast" role="status" hidden></div>
  </body>
</html>
