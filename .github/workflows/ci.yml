name: CI
"on":
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Python test dependencies
        run: python -m pip install -e '.[web,dev]'
      - name: Install pinned existing browser test tool
        run: |
          npm install --registry=https://registry.npmjs.org --prefix "$RUNNER_TEMP/qa" @playwright/cli@0.1.22
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/qa/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Full release gate on disposable PostgreSQL
        env:
          LLM_API_KEY: ''
          WORKSPACE_PROFILE: local
        run: python scripts/release_gate.py --checks full --backend docker --report output/ci/gate.json
      - name: Retain diagnostic reports only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gate-${{ github.sha }}
          path: |
            output/ci/gate.json
            output/ci/isolated/*.txt
          retention-days: 7
          if-no-files-found: warn
