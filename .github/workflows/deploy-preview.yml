name: Deploy preview
"on":
  workflow_dispatch:
    inputs:
      confirm:
        description: "必须输入 HEAD；只部署已通过 CI 的当前提交到测试环境"
        required: true
        default: ""
permissions:
  contents: read
concurrency:
  group: deploy-preview
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: preview
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deployment dependencies
        run: python -m pip install -e ".[web,dev]"
      - name: Require explicit HEAD confirmation
        if: inputs.confirm != 'HEAD'
        run: |
          echo "confirm 必须为 HEAD，实际：${{ inputs.confirm }}"
          exit 1
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SHILIE_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SHILIE_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "缺少 secrets.SHILIE_SSH_KEY"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "缺少 secrets.SHILIE_KNOWN_HOSTS"; exit 1; }
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/selfstock_8_156_81_128_rsa"
          chmod 600 "$HOME/.ssh/selfstock_8_156_81_128_rsa"
          mkdir -p output/playwright/review-001-gpt/fix-v84/enterprise-ops-v85/native-server-access
          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > output/playwright/review-001-gpt/fix-v84/enterprise-ops-v85/native-server-access/known_hosts
      - name: Deploy to preview
        run: python scripts/deploy_release.py --target preview --apply --confirm HEAD
