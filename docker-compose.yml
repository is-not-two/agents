# 一键部署编排：db 服务供 V1 搭建 PostgreSQL + pgvector；app 服务在 V2-e 启用
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    container_name: rag-pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_tech_doc}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        WITH_RAG: ${WITH_RAG:-false}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rag_tech_doc}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      WORKSPACE_ACCESS_TOKEN: ${WORKSPACE_ACCESS_TOKEN:-}
      WORKSPACE_REQUIRE_AUTH: ${WORKSPACE_REQUIRE_AUTH:-false}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-8770}:8000"
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./data/local:/app/data/local
      - ./config/agent-tools.yaml:/app/config/agent-tools.yaml:ro
      - ./output/stages:/app/output/stages
      - model_cache:/home/workspace/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 3

volumes:
  pgdata:
  model_cache:
