<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>时列 · 私密管理预览</title>
<style>
:root{
  --ink:#142f42;--accent:#2b7884;--line:#cedde1;--bg:#e8f0f2;
  --done:#4a8f5e;--todo:#b08a5a;--rose:#a4596b;--violet:#6d5a8c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

.note{background:#fff;border-bottom:1px solid var(--line);padding:15px 28px;
  display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.note h1{font-size:16px;margin:0;font-weight:600}
.note p{margin:2px 0 0;font-size:12px;color:#6b828a}
.tools{margin-left:auto;display:flex;gap:8px}
.btn{padding:8px 15px;border:1px solid #b6cdd2;border-radius:8px;background:#fff;font-size:13px}
.btn:hover{background:#e9f3f3}

.wrap{max-width:1120px;margin:0 auto;padding:26px 24px 60px}
.caption{font-size:11px;color:#6c838b;margin:0 0 8px;letter-spacing:1.5px}
h2{font-size:25px;margin:0 0 5px;font-weight:600}
.sub{color:#6b828a;font-size:13px;margin:0 0 20px}

.tabs{display:flex;gap:4px;padding:4px;background:#dde9ea;border-radius:10px;margin-bottom:20px;width:max-content}
.tabs button{padding:9px 24px;border-radius:7px;font-size:13px;color:#4c6a72}
.tabs button[aria-pressed=true]{background:#fff;color:#1d5460;font-weight:600;box-shadow:0 1px 4px #17384a1f}

.pane{display:none}.pane.on{display:block}

.note-box{background:#fff8e6;border:1px solid #e8d5a8;border-radius:9px;padding:12px 16px;
  margin:0 0 18px;font-size:13px;color:#7a6224}
.note-box b{color:#5f4b18}
.note-box.rose{background:#fdf0f3;border-color:#e8c4cd;color:#7a3b49}
.note-box.rose b{color:#5c2734}

/* 愿望卡片墙 */
.filters{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:20px;border:1px solid #b6cdd2;background:#fff;font-size:13px;color:#4c6a72}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.search{flex:1;min-width:170px;padding:9px 14px;border:1px solid #b6cdd2;border-radius:8px;background:#fff;font:inherit}
.add{margin-left:auto;padding:9px 17px;border-radius:8px;background:var(--rose);color:#fff;font-size:13px}

.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.w{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  display:flex;flex-direction:column;transition:.16s}
.w:hover{box-shadow:0 5px 16px #1d4b5816;transform:translateY(-2px)}
.w.done{background:#fbfdfb}
.w.done .w-title{color:#8b9a94;text-decoration:line-through}
.cover{height:88px;display:grid;place-items:center;font-size:30px;border-bottom:1px solid #eef3f3}
.w-body{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:6px}
.w-title{font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.w-note{font-size:12px;color:#7b929a;overflow-wrap:anywhere}
.w-foot{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12px}
.cat{padding:2px 8px;border-radius:4px;background:#f3ecef;color:#8b5f6e}
.price{margin-left:auto;color:#5f7d84;font-variant-numeric:tabular-nums}
.w-ops{display:flex;gap:3px;padding:0 10px 10px}
.op{width:26px;height:26px;border-radius:6px;color:#9ab0b6;font-size:14px}
.op:hover{background:#eef4f4;color:#2b6b73}

/* 日记 */
.dlist{display:grid;gap:10px}
.d{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px 18px}
.d-top{display:flex;align-items:center;gap:11px}
.d-date{font-size:13px;color:#6b828a;font-variant-numeric:tabular-nums}
.d-title{font-size:15px;font-weight:600;flex:1;min-width:0}
.d-sum{margin-top:7px;font-size:13px;color:#5d7680;line-height:1.75}
.lock{font-size:11px;padding:3px 9px;border-radius:5px;background:#f0eaf5;color:#6d5a8c}

/* 锁屏 */
.lock-screen{max-width:400px;margin:60px auto;background:#fff;border:1px solid var(--line);
  border-radius:15px;padding:34px;text-align:center;box-shadow:0 10px 34px #1d4b5814}
.lock-icon{width:58px;height:58px;border-radius:16px;background:#f3ecf1;color:var(--rose);
  display:grid;place-items:center;font-size:26px;margin:0 auto 18px}
.lock-screen h3{font-size:19px;margin:0 0 8px}
.lock-screen p{font-size:13px;color:#6b828a;margin:0 0 22px}
.pin{width:100%;padding:13px;border:1px solid #b6cdd2;border-radius:9px;font:inherit;
  text-align:center;letter-spacing:5px;font-size:17px;margin-bottom:12px}
.pin-btn{width:100%;padding:12px;border-radius:9px;background:var(--rose);color:#fff;font-size:14px}
.err{color:#a44f45;font-size:13px;margin-top:12px;min-height:19px}

.badge{position:absolute;top:10px;right:10px;background:#fff;border-radius:50%;
  width:25px;height:25px;display:grid;place-items:center;color:var(--done);font-size:14px;
  box-shadow:0 1px 5px #17384a26}
.w{position:relative}
</style>
</head>
<body>

<div class="note">
  <div>
    <h1>私密管理 · 愿望清单 + 日记 + 密码锁</h1>
    <p>参考 Genie's Wishlists「无账号、数据不外传」的定位。示例数据，不入库。</p>
  </div>
  <div class="tools">
    <button class="btn" id="lockBtn">模拟锁定</button>
  </div>
</div>

<div class="wrap">
  <!-- 锁屏 -->
  <div class="pane on" id="p-lock">
    <div class="lock-screen">
      <div class="lock-icon">🔒</div>
      <h3>私密管理已锁定</h3>
      <p>这里的愿望与日记只有你能看到。<br>输入密码继续。</p>
      <input class="pin" id="pin" type="password" placeholder="••••" maxlength="12">
      <button class="pin-btn" onclick="unlock()">解锁</button>
      <div class="err" id="err"></div>
      <p style="margin:18px 0 0;font-size:12px;color:#9ab0b6">
        演示密码：<b style="color:#5d7680">1234</b></p>
    </div>
  </div>

  <!-- 主体 -->
  <div class="pane" id="p-main">
    <p class="caption">PRIVATE</p>
    <h2>私密管理</h2>
    <p class="sub">愿望清单与私密日记，不出现在其他模块，也不出现在备份里。</p>

    <div class="note-box rose">
      <b>加密范围待你决定：</b>方案 A 全部加密（愿望+日记都加密后入库，密码丢了永久无法恢复）；
      方案 B 只做密码锁门（内容明文存库，进模块要密码）；
      方案 C 加密 + 恢复码。本预览先按「锁屏 + 模块内分区」呈现交互。
    </div>

    <div class="tabs">
      <button data-tab="wish" aria-pressed="true" onclick="tab('wish')">愿望清单</button>
      <button data-tab="diary" aria-pressed="false" onclick="tab('diary')">私密日记</button>
    </div>

    <div class="pane on" id="tab-wish">
      <div class="filters">
        <button class="chip" data-c="all" aria-pressed="true" onclick="filt('all')">全部</button>
        <button class="chip" data-c="想拥有" aria-pressed="false" onclick="filt('想拥有')">想拥有</button>
        <button class="chip" data-c="想去做" aria-pressed="false" onclick="filt('想去做')">想去做</button>
        <button class="chip" data-c="已完成" aria-pressed="false" onclick="filt('已完成')">已完成</button>
        <input class="search" id="q" placeholder="搜索愿望…" oninput="drawWish()">
        <button class="add" onclick="addWish()">＋ 添加愿望</button>
      </div>
      <div class="wall" id="wall"></div>
    </div>

    <div class="pane" id="tab-diary">
      <div class="filters">
        <input class="search" placeholder="搜索日记…" style="margin-left:0">
        <button class="add" onclick="alert('示例：打开日记编辑器')">＋ 写一篇</button>
      </div>
      <div class="dlist" id="dlist"></div>
    </div>
  </div>
</div>

<script>
const WISH=[
 {id:1,e:'🏔',t:'去一次北欧',n:'看极光，住木屋',c:'想去做',p:'',done:false},
 {id:2,e:'📷',t:'换一台全画幅相机',n:'预算一万以内',c:'想拥有',p:'¥8,500',done:false},
 {id:3,e:'🎸',t:'学会弹《月亮代表我的心》',n:'完整弹唱，不要卡壳',c:'想去做',p:'',done:false},
 {id:4,e:'📚',t:'一整面墙的书',n:'文学 + 设计类',c:'想拥有',p:'¥3,200',done:true},
 {id:5,e:'🍜',t:'学会做三道拿手菜',n:'红烧肉、意面、寿司',c:'想去做',p:'',done:false},
 {id:6,e:'⌚',t:'一块机械表',n:'不要太商务',c:'想拥有',p:'¥4,000',done:false},
 {id:7,e:'🚴',t:'骑行环青海湖',n:'和朋友一起，7天',c:'想去做',p:'',done:false},
 {id:8,e:'🎹',t:'拥有一台立式钢琴',n:'放客厅，不弹也行',c:'想拥有',p:'¥12,000',done:false}
];
const DIARY=[
 {d:'2026-10-16',t:'关于「想做的事」清单',s:'列了 30 多个，最后砍到 8 个。砍掉的都是"看起来不错但其实不想要"的。留下来的每一个都让我有点心跳加速。'},
 {d:'2026-10-09',t:'一次失败的计划',s:'想用一个月学完摄影课，第七天就放弃了。原因不是没时间，是我其实不喜欢被安排。这次不再定计划，改成每周想学就学。'},
 {d:'2026-09-28',t:'钱和自由的关系',s:'存钱不是为了钱，是为了"可以说不"。这个念头比任何理财技巧都管用。'},
 {d:'2026-09-15',t:'搬家后的第一个周末',s:'什么都没干，躺了一下午。不内疚。这可能就是我要的生活。'}
];
let cur='all';

function tab(k){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===k)));
  document.getElementById('tab-wish').classList.toggle('on',k==='wish');
  document.getElementById('tab-diary').classList.toggle('on',k==='diary');
}
function filt(c){cur=c;
  document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.c===c)));
  drawWish();}
function drawWish(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const list=WISH.filter(w=>{
    if(cur==='已完成')return w.done;
    if(cur!=='all')return w.c===cur&&!w.done;
    return true;
  }).filter(w=>!q||w.t.toLowerCase().includes(q)||(w.n||'').toLowerCase().includes(q));
  const wall=document.getElementById('wall');
  wall.innerHTML=list.length?list.map(w=>`
    <article class="w ${w.done?'done':''}">
      ${w.done?'<span class="badge">✓</span>':''}
      <div class="cover" style="${w.done?'filter:grayscale(.55);opacity:.6':''}">${w.e}</div>
      <div class="w-body">
        <div class="w-title">${w.t}</div>
        ${w.n?`<div class="w-note">${w.n}</div>`:''}
        <div class="w-foot"><span class="cat">${w.c}</span>
          ${w.p?`<span class="price">${w.p}</span>`:''}</div>
      </div>
      <div class="w-ops">
        <button class="op" onclick="flipW(${w.id})" title="标记完成">✓</button>
        <button class="op" title="编辑">✎</button>
        <button class="op" title="删除">×</button>
      </div>
    </article>`).join(''):'<p style="color:#8aa0a6;padding:20px 0">没有匹配的愿望。</p>';
}
function flipW(id){const w=WISH.find(x=>x.id===id);w.done=!w.done;drawWish();}
function addWish(){alert('示例：打开添加表单');}
function drawDiary(){
  document.getElementById('dlist').innerHTML=DIARY.map(d=>`
    <article class="d">
      <div class="d-top"><span class="d-date">${d.d}</span>
        <span class="d-title">${d.t}</span><span class="lock">私密</span></div>
      <p class="d-sum">${d.s}</p>
    </article>`).join('');
}
function unlock(){
  const v=document.getElementById('pin').value;
  if(v==='1234'){
    document.getElementById('p-lock').classList.remove('on');
    document.getElementById('p-main').classList.add('on');
    document.getElementById('err').textContent='';
    drawDiary();
  }else{
    document.getElementById('err').textContent='密码不正确，请重试';
  }
}
document.getElementById('lockBtn').onclick=()=>{
  document.getElementById('p-main').classList.remove('on');
  document.getElementById('p-lock').classList.add('on');
  document.getElementById('pin').value='';
};
document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
drawWish();
</script>
</body>
</html>
