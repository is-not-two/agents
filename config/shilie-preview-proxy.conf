# Include only in existing nginx http context. Preview 8771 only; no 8770 route.
upstream shilie_preview_backend {
    server 127.0.0.1:18771;
    keepalive 32;
}
map $http_upgrade $shilie_preview_connection {
    default upgrade;
    '' '';
}
server {
    listen 8771 ssl;
    server_name 8.156.81.128;
    ssl_certificate /var/lib/shilie-preview/app/credentials/server.crt;
    ssl_certificate_key /var/lib/shilie-preview/app/credentials/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SHILIE_PREVIEW:5m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    client_max_body_size 64m;
    location / {
        proxy_pass http://shilie_preview_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $shilie_preview_connection;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
